# 所有基础服务（MySQL、Redis、IoTDB、EMQX、MinIO）已集中管理在本文件中

services:
  # ========== RTSP -> WebRTC 低延迟网关 ==========
  webrtc-streamer:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mpromonet/webrtc-streamer:master-arm64-linuxarm64
    container_name: dam-webrtc-streamer
    restart: unless-stopped
    platform: linux/arm64
    # host 网络让 WebRTC 正确发布 Jetson 的 LAN ICE 候选；HTTP 信令只监听
    # 回环地址，由 Python 后端做认证代理，避免暴露 RTSP 凭据和任意拉流接口。
    network_mode: host
    command:
      - -H
      - 127.0.0.1:8002
      - -s-
      - -R
      - 50000:50100
      # 海康子码流建议设为 H.264；透传编码可显著降低 Jetson CPU 和延迟。
      - -o
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8002"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========== 前端（Vite 开发服务器） ==========
  dam-frontend:
    build:
      context: ./dam-frontend
      dockerfile: Dockerfile
    container_name: dam-frontend
    restart: unless-stopped
    # 挂载源码目录，修改后 docker compose restart dam-frontend 即可生效
    volumes:
      - ./dam-frontend/src:/app/src
      - ./dam-frontend/public:/app/public
      - ./dam-frontend/index.html:/app/index.html
      - ./dam-frontend/vite.config.js:/app/vite.config.js
    environment:
      TZ: Asia/Shanghai
      # Vite 环境变量（VITE_ 前缀会被注入到前端代码中）
      # 留空表示使用相对路径，通过 Vite 代理访问 OnlyOffice（解决公网访问问题）
      VITE_ONLYOFFICE_URL: "${VITE_ONLYOFFICE_URL:-}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8090}"
    network_mode: host

  # ========== Python后端（一体化服务） ==========
  dam-server-python:
    build:
      context: ./dam-backend
      dockerfile: Dockerfile
    container_name: dam-server-python
    restart: unless-stopped
    depends_on:
      webrtc-streamer:
        condition: service_healthy
    # dai: YOLO 使用 Jetson CUDA；NVIDIA 官方要求 GPU 容器启用 nvidia runtime。
    runtime: nvidia
    healthcheck:
      test: ["CMD", "python", "/app/scripts/check_history_health.py", "--max-queue-age", "120", "--max-rollup-lag", "10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    # 挂载源码目录，修改后只需 docker compose restart 即可生效
    volumes:
      - ./dam-backend:/app
      # 挂载 Jetson 平台工具和设备树，用于读取 GPU/温度/功耗
      - /usr/bin/tegrastats:/usr/bin/tegrastats:ro
      - /usr/sbin/nvidia-smi:/usr/sbin/nvidia-smi:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - /proc/device-tree:/proc/device-tree:ro
      # 挂载宿主机 /proc（只读），用于检测 GPU 推理进程
      - /proc:/host/proc:ro
      # 挂载 YOLO 模型权重目录
      - /home/jetson/wh_test/roboflow/runs:/models/runs:ro
      - /home/jetson/sep/disaster_idf/yolo26x/models:/models/disaster-classifier:ro
    env_file:
      - ./dam-miniprogram/wechat-keys/wechat.env
    environment:
      # vLLM 视觉模型
      VLLM_QWEN3VL_URL: "${VLLM_QWEN3VL_URL:-http://localhost:8003}"
      # IoTDB
      IOTDB_HOST: 127.0.0.1
      IOTDB_PORT: 6667
      # MySQL
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: dam_system
      # Redis 缓存
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: redis
      # 无鉴权系统：JWT 仅用于兼容旧客户端调用 /api/auth/login。
      JWT_SECRET: "${JWT_SECRET:-no-auth-local-secret}"
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_SECONDS: "${JWT_EXPIRE_SECONDS:-1296000}"
      # 默认管理员（仅在首次启动且用户不存在时创建）
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-admin}"
      DEFAULT_ADMIN_REALNAME: "管理员"
      # 可扩展视觉模型。分类模型默认使用当前 Jetson 上导出的 TensorRT engine。
      YOLO_DETECT_MODEL_PATH: "${YOLO_DETECT_MODEL_PATH:-/models/runs/yolo26x_continue/weights/best.pt}"
      YOLO_CLASSIFY_MODEL_PATH: "${YOLO_CLASSIFY_MODEL_PATH:-/models/disaster-classifier/best.engine}"
      YOLO_CLASSIFY_FALLBACK_PATH: "${YOLO_CLASSIFY_FALLBACK_PATH:-/models/disaster-classifier/best.pt}"
      YOLO_CONFIDENCE: "0.5"
      YOLO_IOU: "0.45"
      CAMERA_DETECTION_FPS: "${CAMERA_DETECTION_FPS:-5}"
      CAMERA_JPEG_QUALITY: "${CAMERA_JPEG_QUALITY:-80}"
      MINIPROGRAM_LIVE_ENABLED: "${MINIPROGRAM_LIVE_ENABLED:-true}"
      MINIPROGRAM_LIVE_USE_SUBSTREAM: "${MINIPROGRAM_LIVE_USE_SUBSTREAM:-true}"
      MINIPROGRAM_LIVE_PUBLISH_BASE_URL: "${MINIPROGRAM_LIVE_PUBLISH_BASE_URL:-rtmp://127.0.0.1:1936}"
      MINIPROGRAM_LIVE_PUBLIC_BASE_URL: "${MINIPROGRAM_LIVE_PUBLIC_BASE_URL:-rtmp://192.168.31.52:1936}"
      MINIPROGRAM_LIVE_STARTUP_GRACE_SECONDS: "${MINIPROGRAM_LIVE_STARTUP_GRACE_SECONDS:-2.0}"
      # WebRTC Streamer 仅监听宿主机回环地址，信令通过后端认证代理。
      WEBRTC_STREAMER_URL: "${WEBRTC_STREAMER_URL:-http://127.0.0.1:8002}"
      WEBRTC_STREAM_OPTIONS: "${WEBRTC_STREAM_OPTIONS:-rtptransport=tcp&timeout=10}"
      MAX_VIDEO_SIZE_MB: "${MAX_VIDEO_SIZE_MB:-200}"
      MAX_VIDEO_DURATION_SECONDS: "${MAX_VIDEO_DURATION_SECONDS:-600}"
      VIDEO_DETECTION_FPS: "${VIDEO_DETECTION_FPS:-2}"
      # OnlyOffice / 文档服务
      APP_PORT: "${APP_PORT:-8090}"
      PUBLIC_HOST: "${PUBLIC_HOST:-192.168.31.52}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-http://localhost:${APP_PORT:-8090}}"
      ONLYOFFICE_PUBLIC_URL: "${ONLYOFFICE_PUBLIC_URL:-http://121.248.203.47}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-mysecretkey}"
      DOCUMENT_BUCKET: "${DOCUMENT_BUCKET:-documents}"
      PATROL_REPORT_AUTO_ENABLED: "${PATROL_REPORT_AUTO_ENABLED:-true}"
      PATROL_REPORT_AUTO_TIME: "${PATROL_REPORT_AUTO_TIME:-00:00}"
      PATROL_REPORT_USER_ID: "${PATROL_REPORT_USER_ID:-user_001}"
      PATROL_REPORT_USER_NAME: "${PATROL_REPORT_USER_NAME:-管理员}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-localhost:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      # 微信小程序订阅消息。AppSecret 不要写入源码，部署时放入 .env。
      WECHAT_MINIPROGRAM_APP_ID: "${WECHAT_MINIPROGRAM_APP_ID:-wx0915df56d799f471}"
      WECHAT_RISK_TEMPLATE_ID: "${WECHAT_RISK_TEMPLATE_ID:-5NGdwcxDcjqwTuuCCp-LTbiSEl4Cp8N08wN-0R-WbcA}"
      WECHAT_RISK_TEMPLATE_FIELDS: "${WECHAT_RISK_TEMPLATE_FIELDS:-thing1,thing2,thing3,time4}"
      WECHAT_NOTIFY_ENABLED: "${WECHAT_NOTIFY_ENABLED:-true}"
      BROADCAST_ENABLE_USB_AUDIO_DEVICE: "${BROADCAST_ENABLE_USB_AUDIO_DEVICE:-true}"
      BROADCAST_USB_ALSA_DEVICE: "${BROADCAST_USB_ALSA_DEVICE:-plughw:2,0}"
      BROADCAST_TTS_VOICE: "${BROADCAST_TTS_VOICE:-cmn}"
      BROADCAST_TTS_SPEED_WPM: "${BROADCAST_TTS_SPEED_WPM:-150}"
      BROADCAST_AUDIO_BUSY_RETRIES: "${BROADCAST_AUDIO_BUSY_RETRIES:-5}"
      BROADCAST_AUDIO_BUSY_RETRY_SECONDS: "${BROADCAST_AUDIO_BUSY_RETRY_SECONDS:-1}"
    devices:
      - "/dev/snd:/dev/snd"
      - "/dev/ttyCH341USB0:/dev/ttyCH341USB0"
      - "/dev/ttyCH341USB1:/dev/ttyCH341USB1"
      - "/dev/ttyCH341USB2:/dev/ttyCH341USB2"
      - "/dev/ttyCH341USB3:/dev/ttyCH341USB3"
    network_mode: host

  # ========== 轻量级模型库服务 ==========
  dam-model-library:
    build:
      context: ./dam-model-library
      dockerfile: Dockerfile
    container_name: dam-model-library
    restart: unless-stopped
    # 挂载源码目录和 docker.sock（操作宿主机 Docker）
    volumes:
      - ./dam-model-library:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # MySQL
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: dam_system
    network_mode: host

  # ========== DAM 工作流生成服务 ==========
  dam-workflow:
    build:
      context: ./dam-workflow
      dockerfile: Dockerfile
    container_name: dam-workflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 挂载源码目录，修改后只需 docker compose restart 即可生效
    volumes:
      - ./dam-workflow:/app
    environment:
      # MySQL（模型库数据库）
      MODEL_REGISTRY_DB_HOST: 127.0.0.1
      MODEL_REGISTRY_DB_PORT: "3306"
      MODEL_REGISTRY_DB_USER: root
      MODEL_REGISTRY_DB_PASSWORD: root
      MODEL_REGISTRY_DB_NAME: dam_system
      # 模型库 API
      MODEL_REGISTRY_API_BASE: http://127.0.0.1:5001
      # DAM 工作流默认模型（使用模型库中已适配 /infer 的包装服务）
      LLM_LOCAL_MODEL_ID: "14"
      LLM_CLOUD_MODEL_ID: "13"
      LLM_FALLBACK_MODEL_ID: "9"
      # 服务配置
      HOST: "0.0.0.0"
      PORT: "5002"
    network_mode: host

  # ========== OnlyOffice 文档编辑服务 ==========
  onlyoffice-documentserver:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/onlyoffice/documentserver:9.4.0.1-linuxarm64
    container_name: dam-onlyoffice
    restart: unless-stopped
    network_mode: host
    volumes:
      # 持久化配置和数据
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_rabbitmq:/var/lib/rabbitmq
      - onlyoffice_redis:/var/lib/redis
      - onlyoffice_postgresql:/var/lib/postgresql
    environment:
      # JWT 安全配置（生产环境必须设置）
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-mysecretkey}
      JWT_HEADER: Authorization
      # 内网部署：允许 Document Server 下载本机/局域网后端提供的文档文件。
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      # 数据库配置（使用内置 PostgreSQL）
      DB_TYPE: postgres
      # 文档存储路径
      DOCUMENT_SERVER_STORAGE_PATH: /var/www/onlyoffice/Data
      # 启用回调 URL（文档保存时回调）
      # CALLBACK_URL is supplied per document by /api/onlyoffice/editor-config/{id}
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # ARM64 模拟启动较慢，延长等待时间
    # 资源限制（根据 Jetson 性能调整）
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ========== MediaMTX 流媒体服务器（RTMP → RTSP 转封装，供无人机直播） ==========
  dij-mediamtx:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bluenviron/mediamtx:latest-linuxarm64
    container_name: dij-mediamtx
    restart: unless-stopped
    ports:
      - "1936:1935"       # RTMP 推流入口
      - "8555:8554"       # RTSP 流输出（WebRTC-Streamer 拉流）
      - "8890:8889"       # WebRTC HTTP API
      - "8189:8189/udp"   # WebRTC ICE/STUN
      - "9998:9997"       # MediaMTX 管理 API
    volumes:
      - ./dij-mediamtx/mediamtx.yml:/mediamtx.yml:ro

  # ========== DJI Cloud API 后端（无人机管理、直播控制） ==========
  dij-backend:
    image: maven:3.8-eclipse-temurin-11
    container_name: dij-backend
    restart: unless-stopped
    working_dir: /app
    command: ["bash", "/app/start-dev.sh"]
    ports:
      - "6790:6789"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./dij-backend/DJI-Cloud-API-Demo-main:/app
      - dij-maven-repo:/root/.m2
      - ./dij-backend/DJI-Cloud-API-Demo-main/start-dev.sh:/app/start-dev.sh:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dij-mediamtx
    deploy:
      resources:
      
        limits:
          memory: 1G

  # ========== DJI Cloud API 前端（手柄上云必需） ==========
  dij-frontend:
    image: node:18-alpine
    container_name: dij-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "yarn config set registry https://registry.npmmirror.com/ && yarn config set ignore-engines true && yarn install --network-timeout 600000 && yarn serve --host"
    ports:
      - "8081:8080"
    volumes:
      - ./dij-frontend/src:/app/src
      - ./dij-frontend/public:/app/public
      - ./dij-frontend/index.html:/app/index.html
      - ./dij-frontend/vite.config.ts:/app/vite.config.ts
      - ./dij-frontend/tsconfig.json:/app/tsconfig.json
      - ./dij-frontend/package.json:/app/package.json
      - ./dij-frontend/env:/app/env
      - dij-frontend-node-modules:/app/node_modules
    environment:
      - VITE_APP_ENVIRONMENT=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dij-backend

  # ========== EMQX（MQTT 消息代理） ==========
  emqx:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/emqx:5.8.8-linuxarm64
    container_name: emqx-server
    restart: unless-stopped
    ports:
      # MQTT
      - "1883:1883"
      # MQTT SSL
      - "8883:8883"
      # MQTT over WebSocket
      - "8083:8083"
      # MQTT over WebSocket SSL
      - "8084:8084"
      # EMQX Dashboard
      - "18083:18083"
    environment:
      # Dashboard 默认用户名密码
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      # 默认管理员密码
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin
    volumes:
      # 数据持久化
      - ./emqx/data:/opt/emqx/data
      # 日志
      - ./emqx/log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ========== IoTDB（时序数据库） ==========
  iotdb:
    image: apache/iotdb:2.0.8-standalone
    hostname: iotdb-service
    container_name: iotdb-service
    restart: always
    ports:
      - "6667:6667"
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - MEMORY_SIZE=4G
      - IOTDB_JMX_OPTS=-Xms2G -Xmx2G -XX:MaxDirectMemorySize=512M -XX:+CrashOnOutOfMemoryError -XX:+UseAdaptiveSizePolicy -Xss512k
      - CONFIGNODE_JMX_OPTS=-Xms1G -Xmx1G -XX:MaxDirectMemorySize=256M -XX:+CrashOnOutOfMemoryError -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8
      - cn_internal_address=iotdb-service
      - cn_internal_port=10710
      - cn_consensus_port=10720
      - cn_seed_config_node=iotdb-service:10710
      - dn_rpc_address=iotdb-service
      - dn_internal_address=iotdb-service
      - dn_rpc_port=6667
      - dn_mpp_data_exchange_port=10740
      - dn_schema_region_consensus_port=10750
      - dn_data_region_consensus_port=10760
      - dn_seed_config_node=iotdb-service:10710
    volumes:
      - ./iotdb/data:/iotdb/data
      - ./iotdb/logs:/iotdb/logs
    networks:
      iotdb:
        ipv4_address: 172.18.0.6
    healthcheck:
      test: ["CMD-SHELL", "/iotdb/sbin/start-cli.sh -h iotdb-service -e 'SHOW VERSION' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ========== MinIO（对象存储） ==========
  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-linuxarm64
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  # ========== MySQL（关系数据库） ==========
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dam_system
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      # 数据持久化
      - ./mysql/data:/var/lib/mysql
      # 自定义配置
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      # 初始化脚本（首次启动执行）
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      # 日志
      - ./mysql/logs:/var/log/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  # ========== Redis（缓存） ==========
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # 数据持久化
      - ./redis/data:/data
      # 自定义配置
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # 日志
      - ./redis/logs:/var/log/redis
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_rabbitmq:
  onlyoffice_redis:
  onlyoffice_postgresql:
  dij-maven-repo:
  dij-frontend-node-modules:

networks:
  iotdb:
    external: true

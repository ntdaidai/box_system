services:
  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:v1.16.3-linuxarm64
    container_name: qdrant
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: Asia/Shanghai
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - ./data:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    deploy:
      resources:
        limits:
          memory: 1G

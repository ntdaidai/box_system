services:
  qwen4b-local:
    build: .
    container_name: qwen4b-local
    network_mode: host
    ports:
      - "9901:9901"
    environment:
      # vLLM 服务地址（本地 Qwen-VL-4B 模型）
      - VLLM_BASE_URL=http://localhost:8001
      - MODEL_NAME=qwen4B
      # 推理参数
      - MAX_TOKENS=2048
      - TEMPERATURE=0.15
      - TIMEOUT=60
    restart: unless-stopped

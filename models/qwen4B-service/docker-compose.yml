services:
  qwen4b-local:
    build: .
    image: qwen4b-local:latest
    container_name: qwen4b-local
    network_mode: host
    ports:
      - "9901:9901"
    environment:
      # vLLM 服务地址（本地 Qwen-VL-4B 模型）
      - VLLM_BASE_URL=http://localhost:8001
      - MODEL_NAME=qwen4B
      # 推理参数
      - MAX_TOKENS=2048
      - TEMPERATURE=0.15
      - TIMEOUT=${TIMEOUT:-240}
      # 知识库增强：4B 工作流推理前自动检索库坝知识库
      - KNOWLEDGE_RETRIEVAL_ENABLED=${KNOWLEDGE_RETRIEVAL_ENABLED:-true}
      - KNOWLEDGE_API_BASE=${KNOWLEDGE_API_BASE:-http://localhost:8090/api/v1/knowledge}
      - KNOWLEDGE_TOP_K=${KNOWLEDGE_TOP_K:-4}
      - KNOWLEDGE_MIN_SCORE=${KNOWLEDGE_MIN_SCORE:-0.1}
      # 媒体转存：AGX 本地 MinIO -> A100 云端 MinIO
      - UPLOAD_MEDIA_TO_CLOUD=true
      - STRICT_MEDIA_UPLOAD=false
      - EDGE_MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - EDGE_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - EDGE_MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - EDGE_MINIO_SECURE=${MINIO_SECURE:-false}
      - EDGE_MINIO_BUCKET=${EDGE_MINIO_BUCKET:-dam}
      - CLOUD_MINIO_ENDPOINT=${A100_MINIO_ENDPOINT:-10.196.85.11:9469}
      - CLOUD_MINIO_ACCESS_KEY=${A100_MINIO_ACCESS_KEY:-minioadmin}
      - CLOUD_MINIO_SECRET_KEY=${A100_MINIO_SECRET_KEY:-minioadmin}
      - CLOUD_MINIO_SECURE=${A100_MINIO_SECURE:-false}
      - CLOUD_MINIO_BUCKET=${A100_MINIO_BUCKET:-cloud-tasks}
      - CLOUD_MEDIA_PREFIX=${CLOUD_MEDIA_PREFIX:-workflow-media}
    restart: unless-stopped
